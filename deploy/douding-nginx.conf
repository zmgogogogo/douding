upstream douding_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    server_name douding.online www.douding.online 47.109.29.158;
    client_max_body_size 50M;
    root /var/www/douding;
    index index.html;

    # API 代理到 Spring Boot 后端
    location /api/ {
        proxy_pass http://douding_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # WebSocket（协作功能）
    location /ws/ {
        proxy_pass http://douding_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 上传文件目录
    location /uploads/ {
        alias /var/www/douding/uploads/;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/douding.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/douding.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = www.douding.online) { return 301 https://$host$request_uri; }
    if ($host = douding.online) { return 301 https://$host$request_uri; }
    listen 80;
    server_name douding.online www.douding.online 47.109.29.158;
    return 404;
}
