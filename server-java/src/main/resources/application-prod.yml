# ============================================
#  豆丁 Douding — 生产环境配置
#  通过环境变量覆盖敏感信息
# ============================================

server:
  port: ${PORT:8080}

spring:
  servlet:
    multipart:
      resolve-lazily: true  # 延迟解析 multipart，确保代理转发时原始流可用


  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/douding?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 10
      maximum-pool-size: 50

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    encoding: UTF-8

douding:
  jwt:
    secret: ${JWT_SECRET}
    expiration: 30d
    admin-secret: ${JWT_ADMIN_SECRET}
    admin-expiration: 12h

logging:
  level:
    root: WARN
    com.douding: INFO

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
