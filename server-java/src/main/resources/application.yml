# ============================================
#  豆丁 Douding — 默认配置 (H2 开发环境)
#  生产: java -jar app.jar --spring.profiles.active=prod
# ============================================

server:
  port: 8080

spring:
  application:
    name: douding-server

  # H2 内存数据库 (MySQL 兼容模式)
  datasource:
    url: jdbc:h2:file:./data/douding;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false;AUTO_SERVER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true
      path: /h2-console

  # Flyway (使用 H2 兼容迁移脚本)
  flyway:
    enabled: true
    locations: classpath:db/migration-h2
    baseline-on-migrate: true
    encoding: UTF-8

  # Redis
  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 4

  servlet:
    multipart:
      max-file-size: 30MB
      max-request-size: 50MB
      # 🔑 关键：延迟解析 multipart，保留原始 InputStream
      # 否则 PythonProxyController 转发给 Python 时请求体已被消费
      resolve-lazily: true

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    property-naming-strategy: LOWER_CAMEL_CASE
    serialization:
      write-dates-as-timestamps: false

# MyBatis-Plus
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.douding.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

# 豆丁业务配置
douding:
  jwt:
    secret: douding-dev-secret-not-for-production
    expiration: 30d
    admin-secret: douding-admin-dev-secret-not-for-production
    admin-expiration: 12h
  upload:
    max-size: 31457280
    allowed-types: jpg,jpeg,png,gif,webp,bmp
  python:
    host: localhost
    port: 3457

logging:
  level:
    root: INFO
    com.douding: DEBUG
    org.springframework.security: INFO

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
